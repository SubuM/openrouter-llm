name: openrouter-llm

services:
  chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: openrouter-chat:local
    ports:
      - "${CHAT_BIND:-0.0.0.0}:${CHAT_PORT:-8501}:8501"
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_CONFIG_DIR: /config
      LOCAL_MODEL_PATH: /models/qwen2.5-0.5b-instruct-q4_k_m.gguf
      LOCAL_MODEL_THREADS: ${LOCAL_MODEL_THREADS:-3}
    volumes:
      - ./:/config:ro
    mem_limit: 2g
    cpus: "3.0"
    pids_limit: 256
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
